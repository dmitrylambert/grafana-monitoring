# Example Grafana alert rule that sends an SMS when a modem's signal drops.
# Adjust `datasourceUid` to your Prometheus data source, and the threshold to taste.
# Route it to the "SMSEagle" contact point via your notification policy.
#
# Channel choice: the adapter reads the `smseagle_channel` label below.
#   smseagle_channel: sms   -> SMS   (this is also the default if the label is absent)
#   smseagle_channel: call  -> voice call (text-to-speech) — use for high-severity rules
# Recipients (optional): add an `smseagle_to` label with comma-separated numbers to
# override the adapter's env default for this alert, e.g.
#   smseagle_to: "+37120000000,+37120000001"
apiVersion: 1

groups:
  - orgId: 1
    name: smseagle
    folder: SMSEagle
    interval: 1m
    rules:
      - uid: smseagle-signal-low
        title: SMSEagle Modem Signal Low
        condition: C
        for: 5m            # must stay below threshold for 5m before firing
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: "Modem signal {{ $values.A }} below 30"
        labels:
          severity: warning
          smseagle_channel: sms   # set to "call" to ring the phone via text-to-speech
          #smseagle_to: "+37120000000"   # optional: override recipients for this alert
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: YOUR_PROMETHEUS_UID
            model:
              datasource: { type: prometheus, uid: YOUR_PROMETHEUS_UID }
              expr: min(smseagle_modem_signal_strength)
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              type: threshold
              refId: C
              conditions:
                - type: query
                  evaluator: { type: lt, params: [30] }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
