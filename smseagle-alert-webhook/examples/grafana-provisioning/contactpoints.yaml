# Example Grafana contact point that routes alerts to this webhook adapter.
# Drop into your Grafana provisioning dir (e.g. /etc/grafana/provisioning/alerting/)
# or recreate the same settings in the UI (Alerting -> Contact points).
#
# URL notes:
#   - Grafana in the same Docker network as the adapter:  http://smseagle-alert-webhook:9099/
#   - Grafana on the same host (adapter port published):  http://host.docker.internal:9099/
#     (add `extra_hosts: ["host.docker.internal:host-gateway"]` to the Grafana service)
#   - Grafana elsewhere on the LAN:                        http://<adapter-host-ip>:9099/
apiVersion: 1

# One contact point handles both channels. Whether an alert goes out as an SMS
# or a text-to-speech voice call is decided by the alert's `smseagle_channel`
# label (`call`/`voice`/`tts` => voice call; anything else => SMS). See
# alert-rule.example.yaml.
contactPoints:
  - orgId: 1
    name: SMSEagle
    receivers:
      - uid: smseagle-webhook
        type: webhook
        settings:
          url: http://smseagle-alert-webhook:9099/
          httpMethod: POST
        disableResolveMessage: false
