server {
    listen 80;
    server_name _;

    # Serve captured SMSEagle APIv2 responses as JSON.
    # Requests have no .json extension and the query string (?access_token=...)
    # is ignored. "$uri.json" is tried first so a file like full_info.json wins
    # over the same-named full_info/ directory.
    location / {
        root /srv/mock;
        default_type application/json;
        try_files $uri.json $uri/index.json =404;
        add_header X-Mock-Source "smseagle-snapshot" always;
    }
}
