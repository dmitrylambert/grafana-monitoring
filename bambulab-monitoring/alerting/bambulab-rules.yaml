apiVersion: 1

groups:
  - orgId: 1
    name: bambulab
    folder: Bambu Lab
    interval: 1m
    rules:
      - uid: bambu-print-error
        title: Print error
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: "The printer reported a print error (non-zero error code)."
        labels:
          printer: p1s
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max(bambulab_print_error_code)
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: bambu-printer-offline
        title: Printer offline
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: OK
        annotations:
          summary: "No fresh data from the printer for over 5 minutes (printer off/unreachable, or exporter down)."
        labels:
          printer: p1s
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max(bambulab_printer_connected)
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: bambu-ams-humidity
        title: AMS humidity high
        condition: C
        for: 30m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: "AMS humidity level is 4 or worse — consider fresh desiccant."
        labels:
          printer: p1s
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max(bambulab_ams_unit_humidity_index)
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - evaluator: { type: gt, params: [3.5] }
